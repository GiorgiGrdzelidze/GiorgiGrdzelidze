name: Refresh profile

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 07:17 Tbilisi
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fonts and tools
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/fonts" @fontsource/geist-sans@5.3.0 @fontsource/geist-mono@5.3.0
          pip install fonttools==4.67.0 brotli==1.2.1

      - name: Fetch stats (Packagist, tests, contributions)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_stats.py

      - name: Build images
        run: FONT_DIR="$RUNNER_TEMP/fonts/node_modules/@fontsource" python scripts/generate.py assets

      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data
          git diff --staged --quiet || { git commit -m 'chore: refresh profile stats'; git push; }
